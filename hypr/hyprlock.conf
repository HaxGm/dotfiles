# HYPRLOCK CONFIG #

$font = AdwaitaMono Nerd Font Mono

general {
    hide_cursor = false
    ignore_empty_input = true
}

# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }


background {
    monitor =
    path = $HOME/Pictures/Wallpapers/cyberpunk-city.jpeg
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(bc8cffff)
    check_color = rgba(56d364ff)
    fail_color = rgba(ff7b72ff)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # check_text = Authenticating...

    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = 0, 150
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}
