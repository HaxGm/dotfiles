# networkmanager_dmenu
[dmenu]
dmenu_command = rofi -i -theme ~/.config/rofi/network.rasi
prompt = 󰖩

# Mark the active connection with rofi's -a flag 
highlight = True

compact = True

# Nerd Font signal glyphs (1-4 bars)
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name:<{max_len_name}s}  {sec:<{max_len_sec}s} {icon:>4}

# Out-of-range WiFi, VPNs and wired profiles stay behind a "Saved connections"
list_saved = False

[dmenu_passphrase]
# Uses rofi's -password, so a typed passphrase shows as dots.
obscure = True
show_pass = kitty --hold -e nmcli device wifi show-password

[editor]
gui_if_available = True
gui = nm-connection-editor
terminal = kitty

[nmdm]
# Seconds to wait after a WiFi rescan before redisplaying the results.
rescan_delay = 5
show_notifications = True
