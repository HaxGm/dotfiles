# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                    
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# Only the modules named below are rendered. Adding a [section] for anything
# else has no effect unless its $variable also appears in this string.
format = """
$cmd_duration $directory$git_branch
  $character"""

[character]
success_symbol = "[ ](bold fg:#3fb950)"
error_symbol = "[ ](bold fg:#ff7b72)"

[git_branch]
style = "bg:#264f78"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#264f78)[$symbol $branch(:$remote_branch)](fg:#e6edf3 bg:#264f78)[ ](bold fg:#264f78)"

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#79c0ff fg:#010409"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#79c0ff)[󰉋 → $path]($style)[](bold fg:#79c0ff)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#484f58)[󰪢 $duration](bold bg:#484f58 fg:#e6edf3)[](bold fg:#484f58)'
